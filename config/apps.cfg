; Configuração inicial do C-DECK — 15 teclas persistentes (esquema v3).
[meta]
version=3

[app1]
name=Volume +
path=action:volume_up

[app2]
name=Mudo Som
path=action:audio_mute

[app3]
name=Play / Pause
path=action:media_play_pause

[app4]
name=Anterior
path=action:media_previous

[app5]
name=Próximo
path=action:media_next

[app6]
name=Volume -
path=action:volume_down

[app7]
name=Bloco de Notas
path=C:\Windows\System32\notepad.exe

[app8]
name=Calculadora
path=C:\Windows\System32\calc.exe

[app9]
name=Paint
path=mspaint.exe

[app10]
name=Mudo Mic
path=action:mic_mute

[app11]
name=Trocar Áudio
path=action:sound_devices

[app12]
name=Navegador
path=https://www.google.com

[app13]
name=Tarefas
path=taskmgr.exe

[app14]
name=Captura
path=SnippingTool.exe

[app15]
name=Configurações
path=ms-settings:
