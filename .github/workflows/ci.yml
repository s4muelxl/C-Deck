name: C-Deck CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: c-deck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Prepare official application icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          $iconBase64 = (Get-Content "brand/cdeck.ico.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) "build/cdeck.ico"), [Convert]::FromBase64String($iconBase64))
          Set-Content -Path "build/cdeck.rc" -Value 'IDI_APP_ICON ICON "build/cdeck.ico"' -Encoding Ascii
      - name: Build Windows desktop app
        shell: msys2 {0}
        run: |
          mkdir -p build/config
          windres build/cdeck.rc build/cdeck-res.o
          gcc -Wall -Wextra -Wpedantic -std=c11 -O2 -D_WIN32_WINNT=0x0601 src/main.c src/interface.c src/actions.c src/config.c build/cdeck-res.o -o build/C-Deck.exe -mwindows -luser32 -lgdi32 -lshell32 -lole32 -luuid -lcomctl32
          cp config/apps.cfg build/config/apps.cfg
          cp README.md build/README.md
      - name: Run configuration parser test
        shell: msys2 {0}
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c11 tests/config_parser_test.c src/config.c -o build/config-test.exe
          ./build/config-test.exe
      - name: Create portable package
        shell: pwsh
        run: Compress-Archive -Path build/C-Deck.exe,build/config,build/README.md -DestinationPath build/C-Deck-Portable.zip -Force
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          New-Item -ItemType Directory -Force -Path "build/installer" | Out-Null
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found." }
          & $compiler installer/C-Deck.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: C-Deck-Windows
          path: |
            build/C-Deck.exe
            build/C-Deck-Portable.zip
            build/installer/C-Deck-Setup.exe
      - name: Publish installer download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: C-Deck — versão mais recente
          body: |
            Instalador oficial do C-Deck para Windows 10/11.

            Baixe o arquivo C-Deck-Setup.exe e execute para instalar.
          files: build/installer/C-Deck-Setup.exe
          overwrite_files: true
          make_latest: true
