name: C-Deck CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: c-deck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run website contract tests
        shell: pwsh
        run: node --test web/tests/ux-contract.test.js
      - name: Verify release version consistency
        shell: pwsh
        run: ./scripts/check-version.ps1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Prepare application icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          & powershell -ExecutionPolicy Bypass -File "brand/build-icon.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Icon generation failed." }
          Set-Content -Path "build/cdeck.rc" -Value @('#define IDI_APP_ICON 101', 'IDI_APP_ICON ICON "build/cdeck.ico"', '1 24 "installer/C-Deck.manifest"') -Encoding Ascii
      - name: Build C-Deck
        shell: msys2 {0}
        run: |
          windres build/cdeck.rc build/cdeck-res.o
          gcc -Wall -Wextra -Wpedantic -std=c11 -O2 -D_WIN32_WINNT=0x0601 src/main.c src/interface.c src/audio.c src/apps.c build/cdeck-res.o -o build/C-Deck.exe -mwindows -luser32 -lshell32 -lole32 -luuid
      - name: Package portable version
        shell: pwsh
        run: |
          Copy-Item README.md build/README.md
          Compress-Archive -Path build/C-Deck.exe,build/README.md -DestinationPath build/C-Deck-Portable.zip -Force
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found." }
          & $compiler installer/C-Deck.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: C-Deck-Windows
          path: |
            build/C-Deck.exe
            build/C-Deck-Portable.zip
            build/installer/C-Deck-Setup.exe
