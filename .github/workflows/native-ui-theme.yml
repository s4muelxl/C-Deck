name: C-Deck Native UI Contracts
on:
  push:
    branches: [codex/c-deck-1.4-design]
    paths:
      - 'src/ui_theme.c'
      - 'src/ui_theme.h'
      - 'tests/ui_theme_test.c'
      - 'src/ui_layout.c'
      - 'src/ui_layout.h'
      - 'tests/ui_layout_test.c'
      - 'src/ui_navigation.c'
      - 'src/ui_navigation.h'
      - 'tests/ui_navigation_test.c'
      - 'src/ui_state.c'
      - 'src/ui_state.h'
      - 'tests/ui_state_test.c'
      - 'src/ui_presentation.c'
      - 'src/ui_presentation.h'
      - 'tests/ui_presentation_test.c'
      - '.github/workflows/native-ui-theme.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/ui_theme.c'
      - 'src/ui_theme.h'
      - 'tests/ui_theme_test.c'
      - 'src/ui_layout.c'
      - 'src/ui_layout.h'
      - 'tests/ui_layout_test.c'
      - 'src/ui_navigation.c'
      - 'src/ui_navigation.h'
      - 'tests/ui_navigation_test.c'
      - 'src/ui_state.c'
      - 'src/ui_state.h'
      - 'tests/ui_state_test.c'
      - 'src/ui_presentation.c'
      - 'src/ui_presentation.h'
      - 'tests/ui_presentation_test.c'
      - '.github/workflows/native-ui-theme.yml'
permissions:
  contents: read
concurrency:
  group: c-deck-native-ui-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-ui-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compile native C11 theme contract
        run: gcc -std=c11 -Wall -Wextra -Wpedantic -Werror src/ui_theme.c tests/ui_theme_test.c -lm -o /tmp/ui-theme-test
      - name: Run native C11 theme contract
        run: /tmp/ui-theme-test
      - name: Compile native C11 layout contract
        run: gcc -std=c11 -Wall -Wextra -Wpedantic -Werror src/ui_layout.c tests/ui_layout_test.c -o /tmp/ui-layout-test
      - name: Run native C11 layout contract
        run: /tmp/ui-layout-test
      - name: Compile native C11 keyboard navigation contract
        run: gcc -std=c11 -Wall -Wextra -Wpedantic -Werror src/ui_navigation.c tests/ui_navigation_test.c -o /tmp/ui-navigation-test
      - name: Run native C11 keyboard navigation contract
        run: /tmp/ui-navigation-test
      - name: Compile native C11 view-state contract
        run: gcc -std=c11 -Wall -Wextra -Wpedantic -Werror src/ui_navigation.c src/ui_state.c tests/ui_state_test.c -o /tmp/ui-state-test
      - name: Run native C11 view-state contract
        run: /tmp/ui-state-test

  windows-native-ui-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Compile and run native UI contracts with MinGW
        shell: msys2 {0}
        run: |
          mkdir -p build
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror src/ui_theme.c tests/ui_theme_test.c -lm -o build/ui-theme-test.exe
          ./build/ui-theme-test.exe
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror src/ui_layout.c tests/ui_layout_test.c -o build/ui-layout-test.exe
          ./build/ui-layout-test.exe
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror src/ui_navigation.c tests/ui_navigation_test.c -o build/ui-navigation-test.exe
          ./build/ui-navigation-test.exe
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror src/ui_navigation.c src/ui_state.c tests/ui_state_test.c -o build/ui-state-test.exe
          ./build/ui-state-test.exe
