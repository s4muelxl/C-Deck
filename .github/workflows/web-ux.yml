name: C-Deck Web UX
on:
  push:
    branches: [codex/c-deck-1.4-design]
    paths:
      - 'web/**'
      - '.github/workflows/web-ux.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ux.yml'
permissions:
  contents: read
concurrency:
  group: c-deck-web-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate website JavaScript
        run: node --check web/main.js
      - name: Run website UX contracts
        run: node --test web/tests/ux-contract.test.js
