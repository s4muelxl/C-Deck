name: C-Deck Release

on:
  workflow_dispatch:
    inputs:
      approve_release:
        description: "Confirmo que a revisão humana foi concluída e autorizo publicar esta tag."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: c-deck-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag' && inputs.approve_release == true
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Validate manual approval and version tag
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          APPROVE_RELEASE: ${{ inputs.approve_release }}
        run: |
          if ($env:RELEASE_REF_TYPE -ne "tag") { throw "Release must be dispatched against an existing Git tag." }
          if ($env:APPROVE_RELEASE -ne "true") { throw "Explicit human approval is required." }
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Tag must use vMAJOR.MINOR.PATCH." }

      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Prepare official application icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          & powershell -ExecutionPolicy Bypass -File "brand/build-icon.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Failed to generate official C-Deck icon." }
          Set-Content -Path "build/cdeck.rc" -Value @('#define IDI_APP_ICON 101', 'IDI_APP_ICON ICON "build/cdeck.ico"') -Encoding Ascii

      - name: Build Windows desktop app
        shell: msys2 {0}
        run: |
          mkdir -p build/config
          windres build/cdeck.rc build/cdeck-res.o
          gcc -Wall -Wextra -Wpedantic -Werror=cast-function-type -std=c11 -O2 -D_WIN32_WINNT=0x0601 src/main.c src/interface.c src/actions.c src/config.c src/profiles.c src/action_library.c src/macros.c src/macro_editor.c src/hotkeys.c src/gdi_scope.c build/cdeck-res.o -o build/C-Deck.exe -mwindows -luser32 -lgdi32 -lshell32 -lole32 -luuid -lcomctl32 -lcomdlg32
          cp config/apps.cfg build/config/apps.cfg
          cp config/macros.cfg.example build/config/macros.cfg.example
          cp README.md build/README.md

      - name: Run configuration, profile, library, macro, hotkey and GDI tests
        shell: msys2 {0}
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c11 tests/config_parser_test.c src/config.c -o build/config-test.exe
          ./build/config-test.exe
          gcc -Wall -Wextra -Wpedantic -std=c11 tests/profiles_test.c src/profiles.c src/config.c -o build/profiles-test.exe
          ./build/profiles-test.exe
          gcc -Wall -Wextra -Wpedantic -std=c11 tests/action_library_test.c src/action_library.c -o build/action-library-test.exe
          ./build/action-library-test.exe
          gcc -Wall -Wextra -Wpedantic -std=c11 tests/macros_test.c src/macros.c -o build/macros-test.exe
          ./build/macros-test.exe
          gcc -Wall -Wextra -Wpedantic -std=c11 tests/hotkeys_test.c src/hotkeys.c -o build/hotkeys-test.exe
          ./build/hotkeys-test.exe
          gcc -Wall -Wextra -Wpedantic -std=c11 tests/gdi_scope_test.c src/gdi_scope.c -lgdi32 -luser32 -o build/gdi-scope-test.exe
          ./build/gdi-scope-test.exe

      - name: Create portable package
        shell: pwsh
        run: Compress-Archive -Path build/C-Deck.exe,build/config,build/README.md -DestinationPath build/C-Deck-Portable.zip -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          New-Item -ItemType Directory -Force -Path "build/installer" | Out-Null
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found." }
          & $compiler installer/C-Deck.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }

      - name: Upload release validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: C-Deck-Windows-${{ github.ref_name }}
          path: |
            build/C-Deck.exe
            build/C-Deck-Portable.zip
            build/installer/C-Deck-Setup.exe
          if-no-files-found: error

      - name: Publish versioned release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: C-Deck ${{ github.ref_name }}
          body: |
            Instalador oficial do C-Deck para Windows 10/11.

            Esta release foi publicada por workflow manual após compilação e testes Windows aprovados e confirmação humana explícita.
          files: build/installer/C-Deck-Setup.exe
          fail_on_unmatched_files: true
          overwrite_files: false
          make_latest: true
