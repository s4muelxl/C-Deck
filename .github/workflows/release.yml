name: C-Deck Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'installer/C-Deck.iss'
      - 'patches/**'
      - 'README.md'
      - 'web/index.html'
      - 'web/tests/**'
      - 'src/**'
      - 'brand/**'
      - 'scripts/**'
      - 'VERSION'

permissions:
  contents: read

concurrency:
  group: c-deck-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw "VERSION must use MAJOR.MINOR.PATCH." }
          $tag = "v$version"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main --depth=1
          if ((git rev-parse HEAD).Trim() -ne (git rev-parse origin/main).Trim()) {
            throw "The release must be built from the current main commit."
          }
          ./scripts/check-version.ps1
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Prepare icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          & powershell -ExecutionPolicy Bypass -File brand/build-icon.ps1
          if ($LASTEXITCODE -ne 0) { throw "Icon generation failed." }
          Set-Content build/cdeck.rc -Value @('#define IDI_APP_ICON 101', 'IDI_APP_ICON ICON "build/cdeck.ico"', '1 24 "installer/C-Deck.manifest"') -Encoding Ascii
      - name: Build application and runtime dependencies
        shell: msys2 {0}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-raylib.ps1
          windres build/cdeck.rc build/cdeck-res.o
          gcc -Wall -Wextra -Wpedantic -std=c11 -O2 -D_WIN32_WINNT=0x0601 -Ibuild/deps/stage/include src/main.c src/interface.c src/audio.c src/apps.c build/cdeck-res.o -o build/C-Deck.exe -mwindows -Lbuild/deps/stage/lib -lraylib -lopengl32 -lgdi32 -lwinmm -luser32 -lshell32 -lole32 -luuid
          cp build/deps/stage/bin/libraylib.dll build/libraylib.dll
          cp build/deps/stage/bin/glfw3.dll build/glfw3.dll
          # Collect all non-system UCRT64 runtime DLLs, including transitive dependencies.
          : > build/runtime-dlls.txt
          for binary in build/C-Deck.exe build/*.dll; do
            [ -f "$binary" ] || continue
            deps=$(ldd "$binary")
            if printf '%s\n' "$deps" | grep -q 'not found'; then
              printf '%s\n' "$deps"
              echo "Unresolved runtime dependency for $binary" >&2
              exit 1
            fi
            printf '%s\n' "$deps" | while read -r first second third rest; do
              if [[ "$second" == "=>" && "$third" == /ucrt64/bin/*.dll ]]; then
                printf '%s\n' "$third"
              elif [[ "$first" == /ucrt64/bin/*.dll ]]; then
                printf '%s\n' "$first"
              fi
            done >> build/runtime-dlls.txt
          done
          sort -u build/runtime-dlls.txt -o build/runtime-dlls.txt
          while IFS= read -r dll; do
            [ -f "$dll" ] && cp -f "$dll" build/
          done < build/runtime-dlls.txt
          echo "Bundled runtime DLLs:"
          ls -1 build/*.dll
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found." }
          & $compiler installer/C-Deck.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: main
          name: C-Deck ${{ steps.meta.outputs.tag }}
          body: "C-Deck — interface Raylib compatível com OpenGL 1.1+, fallback WGL em software, seis ações nativas em C11, Windows Core Audio e ShellExecuteW."
          files: |
            build/installer/C-Deck-Setup.exe
            build/libraylib.dll
            build/glfw3.dll
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
